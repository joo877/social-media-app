<form>
  <section>
    <h1 class="text-4xl font-bold text-blue-600 text-center my-5">
      Linked Posts
    </h1>

    <div class="w-1/2 mx-auto my-3 bg-white p-7 shadow-2xl">
      <h2 class="text-3xl text-blue-600 my-4">Login now</h2>
      <form [formGroup]="login" (ngSubmit)="sendLoginForm()">
        <app-input
          [control]="login.get('email')"
          [inputtype]="'email'"
          [inputid]="'email'"
          [inputplaceholder]="'type your Email'"
        ></app-input>
        <app-input
          [control]="login.get('password')"
          [inputtype]="'password'"
          [inputid]="'password'"
          [inputplaceholder]="'type your Password'"
        ></app-input>

        <button
          type="submit"
          class="text-white mb-3 cursor-pointer bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-5 py-2.5 focus:outline-none"
        >
          Signin
        </button>

        <p class="text-gray-500 text-sm">
          Not registered?
          <span
            routerLink="/signup"
            class="text-blue-700 font-bold cursor-pointer"
            >Create account</span
          >
        </p>
      </form>
    </div>
  </section>
</form>
