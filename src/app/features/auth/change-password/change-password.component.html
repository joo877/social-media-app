<section class="mt-20">
  <div class="w-1/2 mx-auto bg-white p-7 shadow-2xl">
    <h2 class="text-3xl text-blue-600 my-4 font-bold">Change Password</h2>
    <form [formGroup]="changpasswordForm" (ngSubmit)="resetPassword()">
      <app-input
        [flag]="true"
        [inputtype]="'password'"
        [control]="changpasswordForm.get('password')"
        [inputid]="'old-password'"
        [inputlabel]="'Old Password'"
        [inputplaceholder]="'Enter Old Password'"
      ></app-input>

      <app-input
        [flag]="true"
        [inputtype]="'password'"
        [control]="changpasswordForm.get('newPassword')"
        [inputid]="'New-password'"
        [inputlabel]="'New Password'"
        [inputplaceholder]="'Enter New Password'"
      ></app-input>

      <div class="mb-6">
        <label
          for="Confirm-Password"
          class="block mb-2.5 text-sm font-medium text-heading"
        >
          Confirm Password</label
        >
        <input
          type="Password"
          id="Confirm-Password"
          class="bg-neutral-secondary-medium outline-none border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          placeholder="Confirm Password"
          required
        />
      </div>

      <button
        type="submit"
        class="text-white mb-3 w-full cursor-pointer bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-5 py-2.5 focus:outline-none"
      >
        Reset Password
      </button>
    </form>
  </div>
</section>
