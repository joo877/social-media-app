<section>
  <h1 class="text-4xl font-bold text-blue-600 text-center my-3">
    Linked Posts
  </h1>

  <div class="w-1/2 mx-auto my-3 bg-white p-7 shadow-2xl">
    <h2 class="text-3xl text-blue-600 my-3">Register now</h2>
    <form [formGroup]="register" (ngSubmit)="submitform()">
      <app-input
        [control]="register.get('name')"
        [inputtype]="'text'"
        [inputid]="'name'"
        [inputplaceholder]="'type your name ...'"
      ></app-input>

      <app-input
        [control]="register.get('email')"
        [inputtype]="'email'"
        [inputid]="'email'"
        [inputplaceholder]="'type your email ...'"
      ></app-input>

      <app-input
        [control]="register.get('password')"
        [inputtype]="'password'"
        [inputid]="'password'"
        [inputplaceholder]="'type your password '"
      ></app-input>

      <app-input
        [control]="register.get('rePassword')"
        [inputtype]="'password'"
        [inputid]="'rePassword'"
        [inputplaceholder]="'confirm password '"
      ></app-input>

      <app-input
        [control]="register.get('dateOfBirth')"
        [inputtype]="'date'"
        [inputid]="'dateOfBirth'"
      ></app-input>

      <div class="flex space-x-5 items-center my-3">
        <div class="flex items-center">
          <input
            formControlName="gender"
            id="default-radio-1"
            type="radio"
            value="male"
            class="w-4 h-4 cursor-pointer text-neutral-primary bg-neutral-secondary-medium rounded-full checked:border-brand focus:ring-2 focus:outline-none focus:ring-brand-subtle border border-default appearance-none"
          />
          <label
            for="default-radio-1"
            class="select-none ms-2 text-sm font-medium text-heading"
            >Male</label
          >
        </div>
        <div class="flex items-center">
          <input
            formControlName="gender"
            checked
            id="default-radio-2"
            type="radio"
            value="female"
            class="w-4 h-4 cursor-pointer text-neutral-primary bg-neutral-secondary-medium rounded-full checked:border-brand focus:ring-2 focus:outline-none focus:ring-brand-subtle border border-default appearance-none"
          />
          <label
            for="default-radio-2"
            class="select-none ms-2 text-sm font-medium text-heading"
            >Female</label
          >
        </div>
      </div>
      <button
        type="submit"
        class="text-white cursor-pointer bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-5 py-2.5 focus:outline-none"
      >
        Signup
      </button>
    </form>
  </div>
</section>
