<section class="p-5 mt-10">
  <div class="my-4 mx-auto w-1/2 p-5 bg-white rounded-2xl">
    <input
      data-modal-target="authentication-modal"
      data-modal-toggle="authentication-modal"
      readonly
      type="text"
      class="border cursor-pointer border-default-medium text-heading text-sm rounded-3xl block w-full px-2.5 py-2 shadow-xs placeholder:text-gray-600 placeholder:text-md"
      placeholder="what's on your mind ?!"
      required
    />
  </div>

  <div class="w-1/2 mx-auto mt-2 bg-white p-7">
    <div class="flex justify-between items-cente w-full my-5">
      <div class="flex items-center space-x-6">
        <img src="/images/profile.png" class="w-[50px]" alt="" />
        <div>
          <h2 class="text-lg">user name</h2>
          <p class="text-sm">3 hours ago</p>
        </div>
      </div>

      <span class="text-gray-500 cursor-pointer"
        ><i class="fa-solid fa-ellipsis"></i
      ></span>
    </div>

    <p class="text-lg">Lorem ipsum dolor sit amet.</p>
    <img src="/images/route.jpeg" class="w-full my-5" alt="" />
    <p>Show comments</p>
  </div>
</section>

<!-- Main modal -->
<div
  #modal
  id="authentication-modal"
  tabindex="-1"
  aria-hidden="true"
  class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
>
  <div class="relative p-4 w-full max-w-xl max-h-full">
    <!-- Modal content -->
    <div
      class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6"
    >
      <!-- Modal header -->
      <div
        class="flex items-center justify-between border-b border-default pb-4 md:pb-5"
      >
        <h3 class="text-lg font-medium text-heading">Add new post</h3>
        <button
          type="button"
          class="cursor-pointer text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
          data-modal-hide="authentication-modal"
        >
          <svg
            class="w-5 h-5"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18 17.94 6M18 18 6.06 6"
            />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <form class="pt-4 md:pt-6" (submit)="submitForm($event)">
        <div class="mb-4">
          <textarea
            [formControl]="content"
            cols="10"
            rows="3"
            placeholder="write your thoughts here ..."
            class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base w-full px-3 py-2.5 shadow-xs placeholder:text-body"
          ></textarea>
        </div>

        <div class="flex items-center justify-center w-full mb-4">
          <label
            for="dropzone-file"
            class="flex flex-col items-center justify-center w-full h-64 bg-neutral-secondary-medium border border-dashed border-default-strong rounded-base cursor-pointer hover:bg-neutral-tertiary-medium"
          >
            <div
              class="flex flex-col items-center justify-center text-body pt-5 pb-6"
            >
              <svg
                class="w-8 h-8 mb-4"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 17h3a3 3 0 0 0 0-6h-.025a5.56 5.56 0 0 0 .025-.5A5.5 5.5 0 0 0 7.207 9.021C7.137 9.017 7.071 9 7 9a4 4 0 1 0 0 8h2.167M12 19v-9m0 0-2 2m2-2 2 2"
                />
              </svg>
              <p class="mb-2 text-sm">
                <span class="font-semibold">Click to upload</span> or drag and
                drop
              </p>
              <p class="text-xs">SVG, PNG, JPG or GIF (MAX. 800x400px)</p>
            </div>
            <input
              (change)="changeIamge($event)"
              id="dropzone-file"
              type="file"
              class="hidden"
            />
          </label>
        </div>

        <button
          type="submit"
          class="cursor-pointer text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none mb-3"
        >
          post
        </button>
      </form>
    </div>
  </div>
</div>
